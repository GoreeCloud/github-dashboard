name: Validate GoreeCloud Platform Contract 2.1
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: github-dashboard-platform-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-platform-contract:
    uses: GoreeCloud/GoreeCloud/.github/workflows/reusable-platform-manifest-v2-1.yml@1499491159250d5f15dad4e2835fbeee2fda9ce9
    with:
      manifest-path: goreecloud.platform.yaml
